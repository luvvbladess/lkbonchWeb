            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, description]
                  properties:
                    code:
                      type: string
                    description:
                      type: string

  /api/v1/admin/users/{userId}/permissions:
    put:
      tags: [admin]
      operationId: replaceUserPermissions
      summary: Заменить набор прав пользователя
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Права заменены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /api/v1/admin/rating-formula:
    get:
      tags: [admin]
      operationId: getRatingFormula
      responses:
        "200":
          description: Активная формула
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingFormula"
    put:
      tags: [admin]
      operationId: replaceRatingFormula
      summary: Задать формулу рейтинга и пересчитать снимки
      description: |
        definition — объект, не произвольный код.
        type: weighted_average, mean или sum.
        of: final_numeric_grades.
        weight: credits, только для weighted_average.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingFormulaWrite"
      responses:
        "200":
          description: Формула сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingFormula"

  /api/v1/admin/certificate-types:
    get:
      tags: [admin]
      operationId: listAdminCertificateTypes
      responses:
        "200":
          description: Все виды, включая выключенные
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificateType"
    post:
      tags: [admin]
      operationId: createCertificateType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateTypeWrite"
      responses:
        "201":
          description: Вид справки создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateType"

  /api/v1/admin/certificate-types/{typeId}:
    patch:
      tags: [admin]
      operationId: updateCertificateType
      parameters:
        - name: typeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateTypeWrite"
      responses:
        "200":
          description: Вид справки изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateType"

  /api/v1/admin/contracts:
    get:
      tags: [admin]
      operationId: listAdminContracts
      summary: Договоры студентов для сотрудника с правом contracts.manage
      parameters:
        - name: studentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Договоры
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      tags: [admin]
      operationId: createContract
      description: Право `contracts.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractWrite"
      responses:
        "201":
          description: Договор создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /api/v1/admin/contracts/{contractId}/entries:
    post:
      tags: [admin]
      operationId: createLedgerEntry
      summary: Добавить начисление или платёж
      description: |
        Строку потом нельзя изменить. Ошибочную гасит вторая запись с тем же направлением и суммой:
        обе остаются в истории и выпадают из долга. Платёж для этого не используется,
        иначе долг выглядит оплаченным. Демо-оплата проводку не создаёт.
      parameters:
        - $ref: "#/components/parameters/contractId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerWrite"
      responses:
        "201":
          description: Проводка добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"

  /api/v1/admin/scholarships:
    get:
      tags: [admin]
      operationId: listScholarships
      summary: Назначенные стипендии
      parameters:
        - name: studentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Стипендии
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScholarshipGrant"
    post:
      tags: [admin]
      operationId: createScholarship
      description: Право `scholarships.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScholarshipWrite"
      responses:
        "201":
          description: Стипендия назначена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipGrant"

  /api/v1/admin/scholarships/{grantId}/payouts:
    post:
      tags: [admin]
      operationId: createScholarshipPayout
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, paidOn]
              properties:
                amount:
                  type: string
                paidOn:
                  type: string
                  format: date
      responses:
        "201":
          description: Выплата записана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipPayout"

  /api/v1/admin/corrections:
    get:
      tags: [admin]
      operationId: listCorrections
      description: Право `data.correct`.
      parameters:
        - $ref: "#/components/parameters/status"
      responses:
        "200":
          description: Запросы студентов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileCorrection"

  /api/v1/admin/corrections/{correctionId}/decision:
    post:
      tags: [admin]
      operationId: decideCorrection
      summary: Применить или отклонить исправление сведений
      parameters:
        - name: correctionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionDecision"
      responses:
        "200":
          description: Если решение apply, поле профиля уже изменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCorrection"

  /api/v1/admin/imports:
    post:
      tags: [admin]
      operationId: createImport
      summary: Разобрать Excel или CSV и показать ошибки по строкам
      description: |
        Право `import.run`. Пока `dryRun` истинно, база пользователей и расписания не меняется.
        По умолчанию `mode = insert_only`: совпавшие строки попадут в ошибки и не будут перезаписаны.
        `upsert` нужно передавать явно.

        Колонки по доменам:
        - students: last_name, first_name, middle_name, group_name, entry_year, course, funding, record_book_number, student_card_number, email или phone (хотя бы одно)
        - employees: last_name, first_name, middle_name, login, email, phone, position, org_unit
        - groups: name, course, entry_year, org_unit
        - disciplines: code, name, org_unit
        - elective_blocks: group_name, entry_year, semester_title, title
        - curriculum: group_name, entry_year, discipline_code, semester_title, kind, credits, teacher_login, block_title
        - lessons: либо date + starts_at + ends_at, либо weekday + start_time + end_time + week (all, odd или even) на даты семестра; дальше discipline_code, group_name, entry_year, teacher_login, room
        - scholarships: student_card_number, title, amount, next_payout_on
        - contracts: student_card_number, kind, number, title, opened_on
        - ledger: contract_number, direction, amount, occurred_on, description
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [domain, file]
              properties:
                domain:
                  type: string
                  enum: [students, employees, groups, disciplines, elective_blocks, curriculum, lessons, scholarships, contracts, ledger]
                mode:
                  type: string
                  enum: [insert_only, upsert]
                  default: insert_only
                dryRun:
                  type: boolean
                  default: true
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Отчёт разбора. При dryRun статус preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/admin/imports/{batchId}:
    get:
      tags: [admin]
      operationId: getImport
      parameters:
        - $ref: "#/components/parameters/batchId"
      responses:
        "200":
          description: Отчёт, включая ошибки строк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"

  /api/v1/admin/imports/{batchId}/apply:
    post:
      tags: [admin]
      operationId: applyImport
      summary: Записать ранее разобранный файл
      description: Верные строки пишутся одной транзакцией. Ошибочные пропускаются. Уже лежащие данные не повреждаются.
      parameters:
        - $ref: "#/components/parameters/batchId"
      responses:
        "200":
          description: Импорт применён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"

  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      description: Право `audit.read`. Журнал только дополняется.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: entityType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Короткий access-токен. Refresh передаётся в теле, не в этом заголовке.

  parameters:
    from:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    to:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    cursor:
      name: cursor
      in: query
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    status:
      name: status
      in: query
      schema:
        type: string
    lessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    gradeId:
      name: gradeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    applicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    conversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    messageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    contractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    documentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    fileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    orgUnitId:
      name: orgUnitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    semesterId:
      name: semesterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    groupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    disciplineId:
      name: disciplineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    batchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Ошибка с кодом для клиента и русской фразой для человека
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: attendance_closed
              message: Не удалось отметиться. Занятие уже закончилось — обратитесь к преподавателю.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, down]
    Role:
      type: string
      enum: [student, employee, admin]
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Срок access-токена в секундах
    ActivationRequest:
      type: object
      required: [lastName, firstName, identifier]
      properties:
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        identifier:
          type: string
          description: Номер студенческого или зачётки, как выбрал вуз
    ActivationConfirm:
      allOf:
        - $ref: "#/components/schemas/ActivationRequest"
        - type: object
          required: [code, login, password]
          properties:
            code:
              type: string
            login:
              type: string
            password:
              type: string
              format: password
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    UniversityPublic:
      type: object
      required: [name, shortName, brandSeed, brandAccent, enabledSections]
      properties:
        name:
          type: string
        shortName:
          type: string
        brandSeed:
          type: string
        brandAccent:
          type: string
        enabledSections:
          type: array
          description: |
            Включённые модули. Профиль есть всегда.
            Пункт «Услуги» появляется, если включён certificates, dormitory или contracts.
            Выборные показываются внутри дневника.
          items:
            type: string
            enum:
              - schedule
              - diary
              - chats
              - electives
              - certificates
              - dormitory
              - contracts
              - portfolio
              - scholarships
        logoUrl:
          type: string
          nullable: true
    UniversitySettings:
      allOf:
        - $ref: "#/components/schemas/UniversityPublic"
        - type: object
          required: [timezone, studentMatchField]
          properties:
            timezone:
              type: string
            studentMatchField:
              type: string
              enum: [student_card_number, record_book_number]
            passScore:
              type: string
              description: Итоговый балл ниже этого числа сервер считает задолженностью
            failingLabels:
              type: array
              items:
                type: string
    Me:
      type: object
      required: [id, role, status, lastName, firstName, permissions, enabledSections]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum: [pending, active, blocked]
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        login:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
        enabledSections:
          type: array
          items:
            type: string
        student:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StudentProfile"
        employee:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EmployeeProfile"
    StudentProfile:
      type: object
      properties:
        groupId:
          type: string
          format: uuid
          nullable: true
        groupName:
          type: string
          nullable: true
        orgUnitName:
          type: string
          nullable: true
          description: Факультет или институт группы. Отдельным полем у студента не хранится.
        course:
          type: integer
          nullable: true
        funding:
          type: string
          enum: [budget, paid, targeted]
        recordBookNumber:
          type: string
          nullable: true
        studentCardNumber:
          type: string
          nullable: true
        livesInDorm:
          type: boolean
    EmployeeProfile:
      type: object
      properties:
        orgUnitName:
          type: string
          nullable: true
        position:
          type: string
    StudentCard:
      type: object
      required: [fullName, qrPayload]
      properties:
        fullName:
          type: string
        studentCardNumber:
          type: string
          nullable: true
        recordBookNumber:
          type: string
          nullable: true
        groupName:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        qrPayload:
          type: string
          description: Строка вида lkbonch:{shortName}:{studentCardNumber}
    PersonName:
      type: object
      required: [lastName, firstName]
      properties:
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
    Lesson:
      type: object
      required: [id, disciplineName, startsAt, endsAt, room, publicationStatus, groups]
      properties:
        id:
          type: string
          format: uuid
        disciplineName:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        room:
          type: string
        publicationStatus:
          type: string
          enum: [draft, published]
        cancelled:
          type: boolean
        groups:
          type: array
          items:
            type: string
        teacherName:
          type: string
          nullable: true
    LessonDetail:
      allOf:
        - $ref: "#/components/schemas/Lesson"
        - type: object
          properties:
            attendance:
              type: array
              items:
                $ref: "#/components/schemas/Attendance"
            canMarkSelf:
              type: boolean
    AttendanceMark:
      type: string
      enum: [present, absent]
    Attendance:
      type: object
      required: [userId, mark, origin]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        mark:
          $ref: "#/components/schemas/AttendanceMark"
        origin:
          type: string
          enum: [student, system, teacher, admin]
        updatedAt:
          type: string
          format: date-time
    Grade:
      type: object
      required: [id, disciplineName, semesterId, kind, isFinal, isDebt]
      properties:
        id:
          type: string
          format: uuid
        disciplineName:
          type: string
        semesterId:
          type: string
          format: uuid
        semesterTitle:
          type: string
        kind:
          type: string
          enum: [current, passfail, graded_credit, exam]
        title:
          type: string
        score:
          type: string
          nullable: true
        label:
          type: string
        isFinal:
          type: boolean
        isDebt:
          type: boolean
          description: Считает сервер. Клиент при записи это поле не присылает.
        credits:
          type: string
    GradeWrite:
      type: object
      required: [studentId, disciplineId, semesterId, kind, isFinal]
      properties:
        studentId:
          type: string
          format: uuid
        disciplineId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [current, passfail, graded_credit, exam]
        title:
          type: string
        score:
          type: string
          nullable: true
        label:
          type: string
        isFinal:
          type: boolean
    Diary:
      type: object
      required: [semesters]
      properties:
        semesters:
          type: array
          items:
            type: object
            required: [semesterId, title, grades]
            properties:
              semesterId:
                type: string
                format: uuid
              title:
                type: string
              grades:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"
    TeachingAssignment:
      type: object
      required: [groupDisciplineId, disciplineId, semesterId, disciplineName, groupName, semesterTitle, kind]
      properties:
        groupDisciplineId:
          type: string
          format: uuid
        disciplineId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        disciplineName:
          type: string
        groupName:
          type: string
        semesterTitle:
          type: string
        kind:
          type: string
          enum: [required, elective]
    Rating:
      type: object
      required: [score, computedAt]
      properties:
        score:
          type: string
          nullable: true
        computedAt:
          type: string
          format: date-time
          nullable: true
    ElectiveOffer:
      type: object
      required: [groupDisciplineId, disciplineName, credits]
      properties:
        groupDisciplineId:
          type: string
