openapi: 3.0.3
info:
  title: Личный кабинет университета 2.0 beta
  version: 0.1.0
  description: |
    Контракт MVP для веба и будущих мобильных клиентов.
    Один развёрнутый сервер обслуживает один вуз.

    Обработчики исполняют этот контракт.
    Рабочая спецификация для генерации клиента — `GET /openapi.json` (OpenAPI 3.0.3).
    Этот файл остаётся проектным описанием и может отстать от кода.

    Правила, которые нельзя ослабить в реализации:
    - роль выбирает оболочку, а не путается с правами: студенту права не выдаются;
    - оценки и групповой чат принадлежат преподавателю дисциплины, отметку пары правит тот, кто её ведёт;
    - задолженность считает сервер по итоговой оценке, клиент флаг не присылает;
    - в блоке выборных у студента одна живая заявка;
    - демо-оплата не создаёт проводку и не уменьшает долг;
    - закрытый чат заморожен целиком: нельзя ни написать, ни изменить, ни удалить;
    - импорт по умолчанию ничего не пишет, пока не вызван apply.

servers:
  - url: http://localhost:8000

tags:
  - name: auth
  - name: university
  - name: me
  - name: schedule
  - name: diary
  - name: electives
  - name: chats
  - name: notifications
  - name: certificates
  - name: dormitory
  - name: contracts
  - name: portfolio
  - name: files
  - name: admin

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [university]
      operationId: health
      security: []
      summary: Проверка процесса и базы
      responses:
        "200":
          description: База отвечает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: База недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/university:
    get:
      tags: [university]
      operationId: getUniversity
      security: []
      summary: Публичные название, цвета и включённые разделы
      responses:
        "200":
          description: Карточка вуза для экрана входа и оболочки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityPublic"

  /api/v1/university/logo:
    get:
      tags: [university]
      operationId: getUniversityLogo
      security: []
      summary: Логотип, если он загружен
      responses:
        "200":
          description: Файл логотипа
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/auth/activation/request:
    post:
      tags: [auth]
      operationId: requestActivation
      security: []
      summary: Найти импортированного студента и отправить код
      description: |
        Совпадают ФИО и идентификатор из настройки вуза
        (`student_card_number` или `record_book_number`).
        Код уходит на контакт, уже лежащий в базе. В ответе нет признака,
        существует ли студент: текст один и тот же.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "202":
          description: Запрос принят
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Если запись найдена, код отправлен на зарегистрированный контакт.
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/auth/activation/confirm:
    post:
      tags: [auth]
      operationId: confirmActivation
      security: []
      summary: Подтвердить код и задать логин с паролем
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationConfirm"
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Вход сотрудника, администратора или уже активированного студента
      description: Поле login принимает логин, почту или телефон.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      security: []
      summary: Обменять refresh-токен на новую пару
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Новая пара. Прежний refresh больше не действует.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Отозвать текущий refresh-токен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "204":
          description: Токен отозван

  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Сменить свой пароль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        "204":
          description: Пароль изменён, прочие refresh-токены отозваны
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Роль, права и профильные сведения для оболочки
      responses:
        "200":
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /api/v1/me/contacts:
    patch:
      tags: [me]
      operationId: updateMyContacts
      summary: Сменить свою почту или телефон
      description: Группу, номер билета и другие вузовские поля здесь сменить нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        "200":
          description: Обновлённый профиль входа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/me/student-card:
    get:
      tags: [me]
      operationId: getStudentCard
      summary: Электронный студенческий билет
      responses:
        "200":
          description: Фото и строка для QR. QR рисует клиент.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentCard"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/me/scholarship:
    get:
      tags: [me]
      operationId: getMyScholarship
      summary: Назначенная стипендия и история выплат
      responses:
        "200":
          description: Стипендия студента
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipView"

  /api/v1/me/rating:
    get:
      tags: [me]
      operationId: getMyRating
      summary: Текущий рейтинг, уже посчитанный сервером
      responses:
        "200":
          description: Снимок рейтинга
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"

  /api/v1/me/corrections:
    get:
      tags: [me]
      operationId: listMyCorrections
      summary: Свои запросы на исправление вузовских сведений
      responses:
        "200":
          description: Список запросов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileCorrection"
    post:
      tags: [me]
      operationId: createCorrection
      summary: Попросить исправить группу, билет и другие вузовские поля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCorrectionCreate"
      responses:
        "201":
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCorrection"

  /api/v1/schedule:
    get:
      tags: [schedule]
      operationId: listSchedule
      summary: Персональное расписание на интервал
      description: |
        Студент видит опубликованные пары своей текущей группы, включая отменённые.
        Преподаватель видит пары, где он указан ведущим.
        Черновики сюда не попадают. Отменённую пару нельзя отметить.
      parameters:
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
      responses:
        "200":
          description: Пары интервала
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"

  /api/v1/lessons/{lessonId}:
    get:
      tags: [schedule]
      operationId: getLesson
      summary: Пара, участники и отметки, которые этому пользователю можно видеть
      description: |
        Если пара уже началась, опубликована и не отменена, а у ведущего ещё нет отметки,
        сервер сам ставит ему «присутствовал». Отдельный планировщик для этого не нужен.
        Отсутствие строки у студента означает, что он ещё не отмечен, а не что его нет.
      parameters:
        - $ref: "#/components/parameters/lessonId"
      responses:
        "200":
          description: Карточка пары
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/lessons/{lessonId}/attendance:
    post:
      tags: [schedule]
      operationId: markOwnAttendance
      summary: Отметить своё присутствие, пока пара идёт
      description: |
        После `endsAt`, у отменённой пары и у черновика сервер отвечает 422 `attendance_closed`.
        Студент может поставить только присутствие, не отсутствие.
        Без сети клиент кнопку не шлёт. Повторный вызов не создаёт вторую отметку.
      parameters:
        - $ref: "#/components/parameters/lessonId"
      responses:
        "200":
          description: Отметка «присутствовал»
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/lessons/{lessonId}/attendance/{userId}:
    patch:
      tags: [schedule]
      operationId: correctStudentAttendance
      summary: Исправить отметку студента
      description: |
        Вызывать может только ведущий этой пары. Отдельного права на это нет:
        назначение на встречу и есть разрешение. Явку преподавателя этот метод не меняет.
      parameters:
        - $ref: "#/components/parameters/lessonId"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mark]
              properties:
                mark:
                  $ref: "#/components/schemas/AttendanceMark"
      responses:
        "200":
          description: Исправленная отметка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/diary:
    get:
      tags: [diary]
      operationId: getDiary
      summary: Оценки, аттестация и зачётка по семестрам
      parameters:
        - name: semesterId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Дневник
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diary"

  /api/v1/debts:
    get:
      tags: [diary]
      operationId: listDebts
      summary: Академические задолженности
      responses:
        "200":
          description: Оценки с признаком задолженности
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"

  /api/v1/teaching:
    get:
      tags: [diary]
      operationId: listMyTeaching
      summary: Дисциплины и группы, где текущий пользователь указан преподавателем плана
      responses:
        "200":
          description: Назначения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeachingAssignment"

  /api/v1/teaching/{groupDisciplineId}/grades:
    get:
      tags: [diary]
      operationId: listTeachingGrades
      summary: Оценки группы по дисциплине, которую ведёт текущий преподаватель
      parameters:
        - name: groupDisciplineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Студенты группы и их оценки по этой дисциплине
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/grades:
    post:
      tags: [diary]
      operationId: createGrade
      summary: Выставить оценку по дисциплине, где пользователь указан преподавателем плана
      description: |
        Замена на одной паре оценки не ставит. Сервер сам решает, задолженность это или нет,
        и копирует кредиты из учебного плана. Клиент поле isDebt не присылает.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeWrite"
      responses:
        "201":
          description: Оценка записана, рейтинг студента пересчитан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grade"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/grades/{gradeId}:
    patch:
      tags: [diary]
      operationId: updateGrade
      summary: Изменить свою ранее выставленную оценку
      parameters:
        - $ref: "#/components/parameters/gradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeWrite"
      responses:
        "200":
          description: Оценка изменена, рейтинг пересчитан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grade"

  /api/v1/electives:
    get:
      tags: [electives]
      operationId: listElectives
      summary: Выборные дисциплины своей группы в открытый срок
      description: Дисциплины собраны в блоки. В каждом блоке у студента одна живая заявка.
      responses:
        "200":
          description: Дисциплины и текущая заявка, если она есть
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ElectiveOffer"

  /api/v1/elective-applications:
    post:
      tags: [electives]
      operationId: applyForElective
      summary: Подать или сменить выбор до даты изменения
      description: |
        Новая заявка в том же блоке переводит предыдущую живую заявку в withdrawn.
        После даты изменения и после закрытия семестра сервер отвечает 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupDisciplineId]
              properties:
                groupDisciplineId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Заявка принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectiveApplication"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/elective-applications/{applicationId}:
    patch:
      tags: [electives]
      operationId: withdrawElectiveApplication
      summary: Отозвать свою заявку до даты изменения
      parameters:
        - $ref: "#/components/parameters/applicationId"
      responses:
        "200":
          description: Заявка отозвана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectiveApplication"

  /api/v1/staff/elective-applications:
    get:
      tags: [electives]
      operationId: listElectiveQueue
      summary: Очередь заявок на выборные дисциплины
      description: Право `electives.review`.
      parameters:
        - $ref: "#/components/parameters/status"
      responses:
        "200":
          description: Очередь
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ElectiveApplication"

  /api/v1/staff/elective-applications/{applicationId}/decision:
    post:
      tags: [electives]
      operationId: decideElectiveApplication
      summary: Одобрить или отклонить заявку
      parameters:
        - $ref: "#/components/parameters/applicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: Решение записано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectiveApplication"

  /api/v1/conversations:
    get:
      tags: [chats]
      operationId: listConversations
      summary: Чаты пользователя, включая закрытые семестры
      parameters:
        - name: q
          in: query
          description: Поиск по тексту сообщений
          schema:
            type: string
      responses:
        "200":
          description: Список чатов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /api/v1/conversations/direct:
    post:
      tags: [chats]
      operationId: createDirectConversation
      summary: Открыть личный диалог студента и преподавателя по дисциплине
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disciplineId, semesterId, peerUserId]
              properties:
                disciplineId:
                  type: string
                  format: uuid
                semesterId:
                  type: string
                  format: uuid
                peerUserId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Уже существующий или новый диалог
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/conversations/{conversationId}/messages:
    get:
      tags: [chats]
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Страница сообщений, старые дальше по cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
    post:
      tags: [chats]
      operationId: createMessage
      description: |
        В закрытый семестр сервер отвечает 422 `conversation_closed`.
        Повтор с тем же `clientMessageId` возвращает уже сохранённое сообщение.
        Так клиент отправляет очередь, накопленную без сети.
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: Сообщение сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/messages/{messageId}:
    patch:
      tags: [chats]
      operationId: updateMessage
      summary: Редактировать своё сообщение, пока семестр чата открыт
      parameters:
        - $ref: "#/components/parameters/messageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        "200":
          description: Сообщение изменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      tags: [chats]
      operationId: deleteMessage
      summary: Удалить своё сообщение, пока семестр чата открыт
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "204":
          description: Сообщение скрыто

  /api/v1/conversations/{conversationId}/read:
    post:
      tags: [chats]
      operationId: markConversationRead
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
                messageId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Отметка прочтения сдвинута

