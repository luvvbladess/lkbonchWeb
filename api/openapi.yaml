      operationId: syncSemesterChats
      summary: Создать недостающие групповые чаты и добавить участников
      description: |
        По опубликованным парам семестра: отдельный чат на каждую пару «группа + дисциплина».
        Участники — текущие студенты группы и ведущие этих пар.
        Повторный вызов добавляет новых и не удаляет тех, кто уже был в чате.
        Закрытый семестр не открывается заново.
      parameters:
        - $ref: "#/components/parameters/semesterId"
      responses:
        "200":
          description: Сколько чатов создано и сколько участников добавлено
          content:
            application/json:
              schema:
                type: object
                required: [conversationsCreated, membersAdded]
                properties:
                  conversationsCreated:
                    type: integer
                  membersAdded:
                    type: integer

